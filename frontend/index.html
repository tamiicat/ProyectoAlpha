<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FYAG Alpha</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #3b4b5e; }
        .login-card { border-radius: 15px; border: none; }
        .btn-custom { background-color: #2b3d52; border-color: #2b3d52; color: white; }
        .btn-custom:hover { background-color: #1a2533; color: white; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-lg p-4 text-center login-card">
                    <!-- Logo Oficial -->
                    <div class="mb-4 text-center">
                        <img src="img/logo-fyag.png" alt="Logo FYAG" style="max-height: 120px; width: auto; object-fit: contain;">
                    </div>
                    
                    <h5 class="mb-4 fw-bold">Acceso FYAG</h5>
                    
                    <!-- Formulario de Autenticación -->
                    <form action="#" method="POST">
                        <div class="mb-3 text-start">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="email" class="form-control form-control-lg border-start-0 ps-0" placeholder="Usuario" required>
                            </div>
                        </div>
                        <div class="mb-4 text-start">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control form-control-lg border-start-0 ps-0" placeholder="Contraseña" required>
                            </div>
                        </div>
                        <button type="button" onclick="window.location.href='admin.html';" class="btn btn-dark w-100 rounded-pill fw-bold">Iniciar Sesión</button>
                    </form>
                    
                    <!-- Enlace de Recuperación -->
                    <a href="#" class="text-decoration-none text-muted small">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
