<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FYAG Alpha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .login-card { border-radius: 15px; border: none; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-lg p-4 text-center login-card">
                    <h2 class="mb-4 text-primary fw-bold">FYAG Alpha</h2>
                    <p class="text-muted mb-4">Control de Inventario</p>
                    
                    <form action="#" method="POST">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="email" class="form-control form-control-lg" placeholder="operario@fyag.cl" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control form-control-lg" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
